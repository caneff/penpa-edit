name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # AGENTS.md: a file we own may be marked merge=ours in .gitattributes, and git has no built-in driver of that name.
      - run: git config merge.ours.driver true
      # live/upstream-links.live.mjs opens the fork's links on upstream's own files, read from the upstream/master ref.
      - run: git fetch --no-tags --depth=1 https://github.com/swaroopg92/penpa-edit.git master:refs/remotes/upstream/master
      - uses: ./.github/actions/setup-tests
      - run: npm test
      - run: npm run test:live
        if: ${{ !cancelled() }}
