name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_call:
    inputs:
      # The nightly's call turns the engine replay's full mode on (#267): the duplicate link at every checkpoint.
      full-round-trips:
        type: boolean
        default: false

permissions:
  contents: read

# A newer push to a PR cancels that PR's older run (#317). `test` has `if: always()`, so it still runs after the cancel,
# sees `unit`/`live` cancelled and fails: the superseded head shows a red `test`, never success. A push to master and the
# nightly's call (the caller's event, not `pull_request`) each get a group of their own run id and are never cancelled.
# A re-run of an older PR run joins the PR's group and cancels a newer run in progress: re-run the newest run.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# `test` and `expected-files` are the checks `.github/scripts/require-checks.sh` makes required on master; `unit` and
# `live` are the parts `test` waits on (#268).
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-tests
      - shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/logs"
          npm test 2>&1 | tee "$RUNNER_TEMP/logs/unit.log"
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-log-unit
          path: ${{ runner.temp }}/logs

  # A PR runs the live files its change needs (`live/run-live.mjs`); a push and the nightly run them all.
  live:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4]
    steps:
      # A PR's checkout is its merge commit, whose first parent is the base it merges into.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      # The live tests that open Penpa+ as upstream ships it read the upstream/master ref.
      - run: git fetch --no-tags --depth=1 https://github.com/swaroopg92/penpa-edit.git master:refs/remotes/upstream/master
      - uses: ./.github/actions/setup-tests
      - shell: bash
        env:
          BASE: ${{ github.event_name == 'pull_request' && '--base HEAD^1' || '' }}
          REPLAY_FULL_ROUND_TRIPS: ${{ inputs.full-round-trips && '1' || '' }}
        run: |
          mkdir -p "$RUNNER_TEMP/logs"
          node live/run-live.mjs $BASE --part ${{ matrix.part }}/${{ strategy.job-total }} 2>&1 | tee "$RUNNER_TEMP/logs/live-${{ matrix.part }}.log"
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-log-live-${{ matrix.part }}
          path: ${{ runner.temp }}/logs

  # The one required check for the tests. A required check that is skipped counts as passed, so it runs whatever its
  # parts did and fails unless each of them passed.
  test:
    needs: [unit, live]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          UNIT: ${{ needs.unit.result }}
          LIVE: ${{ needs.live.result }}
        run: |
          echo "unit: $UNIT, live: $LIVE"
          [[ $UNIT == success && $LIVE == success ]]

  # The expected-file gate (#33): a PR changes an expected file only when a ticket it closes listed the recording
  # before the fix started. A push has no ticket to read, so the job is skipped there, which a required check accepts.
  # An edit to a ticket starts no run: re-run this job after one.
  expected-files:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - id: gate
        name: Check expected files against the tickets' lists
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          node .github/scripts/expected-gate.mjs ${{ github.event.pull_request.number }}
          ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }} "$RUNNER_TEMP/gate-comment.md"
      # A run with no expected-file change only updates an earlier gate comment, which may say this check fails; a PR
      # that never changed one gets no comment.
      - name: Post the plain-words diff on the PR
        if: ${{ !cancelled() && steps.gate.outputs.changed != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          CHANGED: ${{ steps.gate.outputs.changed }}
        run: |
          comment=(gh pr comment ${{ github.event.pull_request.number }} --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/gate-comment.md")
          if [[ $CHANGED == true ]]; then
            "${comment[@]}" --edit-last --create-if-none
          elif ! "${comment[@]}" --edit-last 2>"$RUNNER_TEMP/edit-last.err"; then
            grep -q 'no comments found' "$RUNNER_TEMP/edit-last.err" || { cat "$RUNNER_TEMP/edit-last.err" >&2; exit 1; }
          fi
